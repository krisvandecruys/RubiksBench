# Model ids checked against fal's catalogue on 2026-10-17; ids and prices change, so re-check with `rubiksbench models`.
backend = "fal"                 # needs FAL_KEY in .env
extractor = "vision"            # how stickers are read: "vision", "sam" (needs `uv sync --extra ml`) or "annotation"
references = "reference_images" # real cube photos scored with every run as a calibration row
prompt = "A valid scrambled standard 3x3 Rubik's Cube on a #7f7f7f background"
iterations = 3                  # images per model, each with a random seed (add `seed = N` for fixed seeds N, N+1, ...)

# fal endpoint ids; list them with `rubiksbench models <name> --backend fal`.
# Endpoints without a seed (FLUX 3 Image, GPT-Image-2.5) run unseeded; the report marks those samples.
[models]
"FLUX 3 Image" = "blackforestlabs/flux-3/text-to-image"
"FLUX 3 Image Klein" = "blackforestlabs/flux-3/klein/text-to-image"
"Nano Banana 2.1" = "google/nano-banana-2.1"
"Nano Banana 2 (Gemini 3.1 Flash Image)" = "fal-ai/nano-banana-2"
"GPT-Image-2.5 Sunburst" = "openai/gpt-image-2.5/sunburst/text-to-image"
"GPT-Image-2.5 Flare" = "openai/gpt-image-2.5/flare/text-to-image"
"Qwen-Image-3.0" = "alibaba/qwen-image-3/text-to-image"
# "Qwen-Image-3.0-Pro"     not on fal
