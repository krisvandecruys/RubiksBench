# Model ids checked against Runware's catalogue on 2026-10-17; ids and prices change, so re-check with `rubiksbench models`.
backend = "runware"             # needs RUNWARE_API_KEY in .env
extractor = "vision"            # how stickers are read: "vision", "sam" (needs `uv sync --extra ml`) or "annotation"
references = "reference_images" # real cube photos scored with every run as a calibration row
prompt = "A valid scrambled standard 3x3 Rubik's Cube on a #7f7f7f background"
iterations = 3                  # images per model, each with a random seed (add `seed = N` for fixed seeds N, N+1, ...)

# 7 families x 2 models; find others with `rubiksbench models <name>`.
[models]
# Black Forest Labs, FLUX 3
"FLUX 3 Image" = "bfl:flux@3-image"
"FLUX 3 Image Klein" = "bfl:flux@3-image-klein"
# Black Forest Labs, FLUX.2 (also: [max] bfl:7@1, [klein] 9B runware:400@2)
"FLUX.2 [pro]" = "bfl:5@1"
"FLUX.2 [dev]" = "runware:400@1"
# Google, Nano Banana
"Nano Banana 2.1" = "google:nano-banana@2.1"
"Nano Banana 2 (Gemini 3.1 Flash Image)" = "google:4@3"
# OpenAI, GPT-Image
"GPT-Image-2.5 Sunburst" = "openai:gpt-image@2.5-sunburst"
"GPT-Image-2.5 Flare" = "openai:gpt-image@2.5-flare"
# Alibaba, Qwen-Image
"Qwen-Image-3.0-Pro" = "alibaba:qwen-image@3.0-pro"
"Qwen-Image-3.0" = "alibaba:qwen-image@3.0"
# ByteDance, Seedream
"Seedream 5.0 Pro" = "bytedance:seedream@5.0-pro"
"Seedream 5.0 Flash" = "bytedance:seedream@5.0-flash"
# Ideogram
"Ideogram 4.5" = "ideogram:4.5@0"
"Ideogram 4.0" = "ideogram:4@0"
