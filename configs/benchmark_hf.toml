# Model ids checked against Hugging Face's catalogue on 2026-10-17; ids and prices change, so re-check with `rubiksbench models`.
backend = "huggingface"         # needs HF_TOKEN in .env
extractor = "vision"            # how stickers are read: "vision", "sam" (needs `uv sync --extra ml`) or "annotation"
references = "reference_images" # real cube photos scored with every run as a calibration row
prompt = "A valid scrambled standard 3x3 Rubik's Cube on a #7f7f7f background"
iterations = 3                  # images per model, each with a random seed (add `seed = N` for fixed seeds N, N+1, ...)

# Hugging Face model ids are Hub repo ids. Only models an Inference Provider serves for
# text-to-image work here; list them with `rubiksbench models <name> --backend huggingface`.
[models]
"Qwen-Image-2512" = "Qwen/Qwen-Image-2512"                # fal-ai, replicate, wavespeed
"Qwen-Image" = "Qwen/Qwen-Image"                          # fal-ai, replicate, together, wavespeed
"FLUX.1 [dev]" = "black-forest-labs/FLUX.1-dev"           # deepinfra, fal-ai, replicate, wavespeed
"FLUX.1 Krea [dev]" = "black-forest-labs/FLUX.1-Krea-dev" # fal-ai, replicate, wavespeed
